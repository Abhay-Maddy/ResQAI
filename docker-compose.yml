version: '3.8'

services:
  resqai-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resqai_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=resqai_super_secret_production_jwt_key_2026_offline
      - JWT_REFRESH_SECRET=resqai_super_secret_production_refresh_key_2026_offline
      - RAZORPAY_KEY_ID=rzp_test_ResQAI2026Official
      - RAZORPAY_KEY_SECRET=rzp_sec_ResQAI2026VerifiedMode
      - RAZORPAY_WEBHOOK_SECRET=resqai_whsec_idempotent_prod_key_2026
    volumes:
      - resqai_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  resqai_data:
    driver: local

